name: pulsegate

services:
  gateway:
    build: .
    image: pulsegate:local
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-8787}:8787"
    environment:
      DATA_DIR: /app/data
      PUBLIC_URL: "${PUBLIC_URL:-}"
      DEV_MODE: "false"
      CHANNEL_MAX_CONCURRENCY: "${CHANNEL_MAX_CONCURRENCY:-64}"
      CONNECT_TIMEOUT: "${CONNECT_TIMEOUT:-5s}"
      RESPONSE_HEADER_TIMEOUT: "${RESPONSE_HEADER_TIMEOUT:-30s}"
      STREAM_IDLE_TIMEOUT: "${STREAM_IDLE_TIMEOUT:-60s}"
      STREAM_MAX_DURATION: "${STREAM_MAX_DURATION:-20m}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-20m}"
      DOWNSTREAM_WRITE_TIMEOUT: "${DOWNSTREAM_WRITE_TIMEOUT:-30s}"
      CIRCUIT_FAILURE_THRESHOLD: "${CIRCUIT_FAILURE_THRESHOLD:-3}"
      CIRCUIT_COOLDOWN: "${CIRCUIT_COOLDOWN:-15s}"
      LOG_QUEUE_SIZE: "${LOG_QUEUE_SIZE:-4096}"
      LOG_WORKERS: "${LOG_WORKERS:-4}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-32}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-16}"
      TZ: Asia/Shanghai
    volumes:
      - pulsegate_data:/app/data
    stop_grace_period: 35s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  pulsegate_data:
