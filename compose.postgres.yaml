# Optional bundled PostgreSQL. Fill POSTGRES_PASSWORD in .env first.
services:
  gateway:
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsegate
      POSTGRES_USER: pulsegate
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsegate -d pulsegate"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    shm_size: 256mb
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  postgres_data:
